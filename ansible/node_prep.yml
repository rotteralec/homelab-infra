- name: Prepare nodes for k3s
  hosts: all
  become: true
  tasks:
    - name: Add cgroup flags to the boot command line
      ansible.builtin.replace:
        path: /boot/firmware/current/cmdline.txt
        regexp: '^(?!.*cgroup_enable=memory)(.+)$'
        replace: '\1 cgroup_memory=1 cgroup_enable=memory'
